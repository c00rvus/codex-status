name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 1.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Tag '$env:REF_NAME' is invalid. Release tags must use vX.Y.Z."
            }

            $version = $Matches.version
            $tag = $env:REF_NAME
          }
          else {
            $version = $env:REQUESTED_VERSION.Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version '$version' is invalid. Enter X.Y.Z without the v prefix."
            }

            $tag = "v$version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Run unit tests
        shell: pwsh
        run: dotnet test .\Codex.TaskbarStatus.Tests\Codex.TaskbarStatus.Tests.csproj -c Release --nologo

      - name: Test release helpers
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-ReleaseHelpers.ps1

      - name: Install Inno Setup
        shell: pwsh
        env:
          INNO_SETUP_VERSION: "6.7.3"
        run: |
          function Find-InnoCompiler {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) {
              return $command.Source
            }

            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
            )
            return $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }

          $compiler = Find-InnoCompiler
          if (-not $compiler) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($winget) {
              & $winget.Source install `
                --id JRSoftware.InnoSetup `
                --exact `
                --version $env:INNO_SETUP_VERSION `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity
              if ($LASTEXITCODE -ne 0) {
                throw "winget could not install Inno Setup $env:INNO_SETUP_VERSION (exit code $LASTEXITCODE)."
              }
            }
            else {
              choco install innosetup --version=$env:INNO_SETUP_VERSION --no-progress --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Chocolatey could not install Inno Setup $env:INNO_SETUP_VERSION (exit code $LASTEXITCODE)."
              }
            }

            $compiler = Find-InnoCompiler
          }

          if (-not $compiler) {
            throw 'Inno Setup compiler (ISCC.exe) was not found after installation.'
          }

          Write-Host "Using Inno Setup compiler: $compiler"

      - name: Compile signed installer
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\Compile-Installer.ps1
          -Version "${{ steps.version.outputs.version }}"
          -TimestampUrl "http://timestamp.digicert.com"

      - name: Validate release files
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $releaseDirectory = Resolve-Path '.\artifacts\release'
          $installer = Join-Path $releaseDirectory "CodexStatusSetup-$version-x64.exe"
          $checksums = Join-Path $releaseDirectory 'SHA256SUMS.txt'
          foreach ($path in @($installer, $checksums)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected release file was not generated: $path"
            }
          }

          $unexpected = @(Get-ChildItem -LiteralPath $releaseDirectory -File |
            Where-Object { $_.FullName -notin @($installer, $checksums) })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected release files were generated: $($unexpected.Name -join ', ')"
          }

          $expectedHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = "$expectedHash  $([IO.Path]::GetFileName($installer))"
          $actualLine = (Get-Content -LiteralPath $checksums -Raw).Trim()
          if ($actualLine -ne $expectedLine) {
            throw 'SHA256SUMS.txt does not match the generated installer.'
          }

          Get-AuthenticodeSignature -FilePath $installer | Format-List Status, StatusMessage, SignerCertificate
          Get-Content -LiteralPath $checksums

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-status-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/CodexStatusSetup-${{ steps.version.outputs.version }}-x64.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-status-${{ needs.build.outputs.version }}
          path: artifacts/release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $installer = Resolve-Path ".\artifacts\release\CodexStatusSetup-$env:RELEASE_VERSION-x64.exe"
          $checksums = Resolve-Path '.\artifacts\release\SHA256SUMS.txt'

          gh release view $env:RELEASE_TAG --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$env:RELEASE_TAG' already exists. Existing releases are never overwritten."
          }

          gh api "repos/$env:REPOSITORY/git/ref/tags/$env:RELEASE_TAG" *> $null
          $tagExists = $LASTEXITCODE -eq 0
          if ($env:EVENT_NAME -eq 'push' -and -not $tagExists) {
            throw "Expected pushed tag '$env:RELEASE_TAG' was not found."
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $tagExists) {
            throw "Tag '$env:RELEASE_TAG' already exists. Manual releases require a new version."
          }

          $releaseNotes = @"
          ## Install

          Download **CodexStatusSetup-$env:RELEASE_VERSION-x64.exe** below and double-click it. No terminal commands, .NET SDK, Windows App Runtime installation, or Developer Mode are required.

          The current installer uses a self-signed certificate, so Windows can show **Unknown publisher**. Confirm that the file came from this repository before choosing **More info > Run anyway**.
          "@

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            $installer.Path, $checksums.Path,
            '--repo', $env:REPOSITORY,
            '--title', "Codex Status $env:RELEASE_VERSION",
            '--notes', $releaseNotes,
            '--generate-notes'
          )
          if ($env:EVENT_NAME -eq 'push') {
            $arguments += '--verify-tag'
          }
          else {
            $arguments += @('--target', $env:RELEASE_TARGET)
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
